# Copy to <target-repo>/runner.toml (or pass --config). CLI flags override.

# Omit test_cmd to auto-detect it from the repo's project markers
# (pyproject/setup.py -> pytest, package.json -> npm test, go.mod -> go test,
#  Cargo.toml -> cargo test; pytest is the fallback).
test_cmd = "pytest {test_path} -q"
# Full suite gate, without {test_path}. Auto-detected separately when omitted.
# regression_cmd = "pytest -q"
# When a ticket runs the full suite: "shared" (only when it changes existing
# behaviour in shared files), "focused" (never; the final gate still runs it once)
# or "full" (after every ticket).
# ticket_regression = "shared"
isolate_worktree = true # keep the source checkout untouched; --in-place opts out
max_rounds = 3        # verifier hand-backs per ticket before it is blocked
tester_retries = 2    # harness bounces (stub/green test) before giving up
coder_retries = 2
github_tickets = true # mirror tickets as gh sub-issues (needs --repo + write access)
open_pr = true        # open a PR when a run finishes with no blocked tickets
# max_ai_credits = 30 # per-call soft cap (copilot minimum is 30)
# max_run_credits = 300 # soft whole-run budget, checked between invocations (exit 4)
empty_reply_retries = 2 # retries when copilot exits 0 with no output (a transport failure)
timeout = 1800        # seconds per model call
provision = true      # give each run worktree its own .venv / node_modules (uv, npm ci)
provision_timeout = 900 # seconds per provisioning step

# Per-role model/effort — spend where it matters, save where it doesn't.
# Run `copilot` and use /model to see what your plan offers.
# --model / --effort on the command line take precedence over these settings.
[roles.planner]
# model = "claude-sonnet-4.5"

[roles."builder.tester"]
# model = "gpt-5-mini"

[roles."builder.coder"]
# model = "claude-sonnet-4.5"

[roles.verifier]
# model = "gpt-5-mini"
# effort = "low"

