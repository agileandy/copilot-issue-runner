# Copy to <target-repo>/runner.toml (or pass --config). CLI flags override.

test_cmd = "pytest {test_path} -q"
max_rounds = 3        # verifier hand-backs per ticket before it is blocked
tester_retries = 2    # harness bounces (stub/green test) before giving up
coder_retries = 2
github_tickets = true # mirror tickets as gh sub-issues (needs --repo + write access)
open_pr = true        # open a PR when a run finishes with no blocked tickets
# max_ai_credits = 30 # per-call soft cap (copilot minimum is 30)

# Per-role model/effort — spend where it matters, save where it doesn't.
# Run `copilot` and use /model to see what your plan offers.
[roles.planner]
# model = "claude-sonnet-4.5"

[roles."builder.tester"]
# model = "gpt-5-mini"

[roles."builder.coder"]
# model = "claude-sonnet-4.5"

[roles.verifier]
# model = "gpt-5-mini"
# effort = "low"
