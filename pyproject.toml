[project]
name = "issue-runner"
version = "0.1.0"
description = "Generic GitHub issue runner driving GitHub Copilot CLI through plan/build/verify phases"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
issue-runner = "issue_runner.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/issue_runner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
