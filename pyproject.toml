[project]
name = "issue-runner"
version = "0.1.0"
description = "Generic GitHub issue runner driving GitHub Copilot CLI through plan/build/verify phases"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
issue-runner = "issue_runner.cli:main"
gh-runner = "issue_runner.cli:gh_main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/issue_runner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
python_functions = "test_*"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# origin/main state of these files, kept out of #151's scope
"src/issue_runner/cli.py" = ["RUF100"]
"src/issue_runner/journal.py" = ["RUF100"]
"tests/test_visual_*.py" = ["PLW1510"]
